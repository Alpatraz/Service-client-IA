name: GET Service × Booking bridge CI

on:
  pull_request:
    paths:
      - 'src/App.tsx'
      - 'src/BookingContextPanel.tsx'
      - 'src/bookingBridge.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/get-service-booking-bridge-ci.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
